function distance(a,b,c,d){const R=6371000,to=x=>x*Math.PI/180,dl=to(c-a),dn=to(d-b),v=Math.sin(dl/2)**2+Math.cos(to(a))*Math.cos(to(c))*Math.sin(dn/2)**2;return 2*R*Math.atan2(Math.sqrt(v),Math.sqrt(1-v))}
async function verifyAndMark(){if(!current||isAdmin())return;const btn=$('.attendance-hero .btn');const nativeGeo=window.TLB3Geolocation;if(!nativeGeo&&!navigator.geolocation){toast('This device does not provide location access.');return}btn.disabled=true;$('#locStatus').textContent='Checking your device location…';try{const p=nativeGeo?await nativeGeo.getCurrentPosition({enableHighAccuracy:true,timeout:12000}):await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,timeout:12000,maximumAge:0}));await workspace.markAttendance({latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy});toast('Attendance marked present.')}catch(e){console.error(e);if($('#locStatus'))$('#locStatus').textContent='Check-in not completed.';toast(e.code===1?'Allow location access, then try again.':e.message||'Could not determine your location. Try again.')}finally{btn.disabled=false;render()}}

async function saveSettings(){const latText=$('#officeLat').value.trim(),lngText=$('#officeLng').value.trim(),office={name:$('#officeName').value.trim(),lat:Number(latText),lng:Number(lngText),radius:Number($('#officeRadius').value)};if(!office.name||!latText||!lngText||!Number.isFinite(office.lat)||!Number.isFinite(office.lng)||office.lat<-90||office.lat>90||office.lng<-180||office.lng>180||office.radius<10){toast('Enter a valid office name, coordinates and radius (at least 10m).');return}try{const user=auth?.currentUser;if(!user)throw new Error('Please sign in again before saving.');await db.ref('settings/office').set({...office,lngScale:Math.max(1,111195*Math.cos(office.lat*Math.PI/180)),updatedAt:Date.now(),updatedBy:user.uid});toast('Office settings updated.')}catch(e){console.error('Office settings save failed',e);toast(/permission|denied/i.test(String(e.code||'')+' '+String(e.message||''))?'Firebase blocked this save. Deploy the latest RTDB rules and verify the administrator profile.':e.message||'Could not save office settings.')}}
function exportAttendance(){let rows=[['Employee','User ID','Department','Date','Check-in','Status','Location']];data.users.forEach(u=>{let s=statusFor(u,registerDay()),r=dayRecord(u.id,registerDay());rows.push([u.name,u.id,u.dept,registerDay(),r?.checkIn||'',s,r?.location||''])});let csv=rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='tlb3-attendance-'+registerDay()+'.csv';a.click();URL.revokeObjectURL(a.href);toast('Attendance CSV exported.')}
const RELEASE_API='https://api.github.com/repos/Tanmay-Tiwaricyber/TLB3/releases/latest';let latestAppRelease=null;function compareAppVersions(a,b){const nums=s=>String(s||'').replace(/^v/i,'').match(/\d+/g)?.map(Number)||[];let x=nums(a),y=nums(b);for(let i=0;i<Math.max(x.length,y.length);i++){let d=(x[i]||0)-(y[i]||0);if(d)return d}return 0}async function openLatestAppRelease(){if(!latestAppRelease)return;const apk=latestAppRelease.assets?.find(a=>String(a.name).toLowerCase().endsWith('.apk')),url=apk?.browser_download_url||latestAppRelease.html_url;if(window.TLB3Browser)await window.TLB3Browser.open({url});else window.open(url,'_blank','noopener')}async function checkForAppUpdates(silent=false){const status=$('#appUpdateStatus'),button=$('#appUpdateButton');if(button){button.disabled=true;button.textContent='Checking…'}if(status)status.textContent='Checking GitHub releases…';try{const res=await fetch(RELEASE_API,{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});if(res.status===404)throw new Error('Release feed unavailable. Make the repository public and publish a release first.');if(!res.ok)throw new Error(`GitHub check failed (${res.status}). Try again later.`);latestAppRelease=await res.json();const current=window.TLB3AppVersion||'1.0.0',tag=latestAppRelease.tag_name||'';const newer=compareAppVersions(tag,current)>0;if(status)status.textContent=newer?`Version ${tag} is available.`:`You’re up to date · ${current}`;if(button){button.textContent=newer?(latestAppRelease.assets?.some(a=>String(a.name).toLowerCase().endsWith('.apk'))?'Download update':'Open release'):'Check again';button.onclick=newer?openLatestAppRelease:()=>checkForAppUpdates(false)}if(newer&&!silent)toast(`TLB3 Pulse ${tag} is available.`)}catch(e){if(status)status.textContent=e.message||'Could not check GitHub releases.';if(button){button.textContent='Try again';button.onclick=()=>checkForAppUpdates(false)}if(!silent)toast(e.message||'Could not check for updates.')}finally{if(button)button.disabled=false}}function openHelp(){modal(`<h2>About & support</h2><p>TLB3 Pulse · Workforce management</p><section class="card about-card"><div class="card-head"><h3>About this app</h3><span class="badge-count">v${window.TLB3AppVersion||'1.0.0'}</span></div><p id="appUpdateStatus" class="update-status">Check GitHub for the latest release.</p><button class="btn btn-primary" id="appUpdateButton" onclick="checkForAppUpdates(false)">Check for updates</button></section><div class="notice">Employee accounts, attendance, payroll and office settings sync through Firebase Authentication and Realtime Database.</div><p class="help-copy">For account access or password resets, contact your workspace administrator.</p><div class="modal-actions"><button class="btn btn-primary" onclick="closeModal()">Close</button></div>`)}async function logout(){if(auth)await auth.signOut()}
connectFirebase();
